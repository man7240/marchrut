name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: System deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev fonts-dejavu-core
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer virtualenv Pillow
      - name: Generate app icon and presplash
        run: |
          if [ -f make_assets.py ]; then
            python make_assets.py
            ls -lah assets
          else
            echo "make_assets.py не найден — иконка/сплэш не генерируются"
          fi
      - name: Cache global buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-bzg-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-bzg-
      - name: Cache project buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-bzp-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-bzp-
      - name: Unpack Russia DB (if uploaded as .gz)
        run: |
          if [ -f ru_data/places_ru.db.gz ]; then gunzip -kf ru_data/places_ru.db.gz; fi
          ls -lah ru_data || true
      - name: Clean output
        run: rm -rf bin build.log
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          unset ANDROID_SDK_ROOT || true
          unset ANDROID_NDK_ROOT || true
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Xmx3g"
          buildozer android debug 2>&1 | tee build.log
      - name: List bin
        if: always()
        run: ls -lah bin || true
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nearbyfinder-debug-apk
          path: bin/*.apk
          if-no-files-found: error
      - name: Prepare failure logs
        if: failure()
        run: |
          grep -n -E "FAILURE:|What went wrong|error:|ERROR|Exception|Traceback" build.log > build-errors.txt || true
          tail -n 30000 build.log > build-tail.log || true
          gzip -9 build-errors.txt build-tail.log || true
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-errors.txt.gz
            build-tail.log.gz
          if-no-files-found: ignore
